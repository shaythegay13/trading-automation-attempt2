[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-screener"
version = "0.1.0"
description = "Read-only Kalshi and Polymarket order-book ingestion and archival."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shay Bouchles" }]
keywords = ["prediction-markets", "kalshi", "polymarket", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "respx>=0.21.0,<1",
    "ruff>=0.8.0,<1",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Generated revisions: keep historical scripts stable.
"alembic/versions/*.py" = ["E402", "F401", "I001"]
